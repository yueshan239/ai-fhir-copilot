services:
  # InterSystems IRIS FHIR Server
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: --check-caps false --ISCAgent false
    ports:
      - "1972:1972"
      - "52773:52773"
      - "53773:53773"
    volumes:
      - iris-data:/durable
    healthcheck:
      test: ["CMD-SHELL", "iris list | grep running || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # AI FHIR Copilot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o}
      - VECTOR_STORE_TYPE=${VECTOR_STORE_TYPE:-faiss}
      - IRIS_HOST=http://iris:52773
      - IRIS_NAMESPACE=${IRIS_NAMESPACE:-USER}
      - IRIS_FHIR_PATH=${IRIS_FHIR_PATH:-/fhir/r4}
      - IRIS_USERNAME=${IRIS_USERNAME:-_SYSTEM}
      - IRIS_PASSWORD=${IRIS_PASSWORD:-SYS}
      - IRIS_SQL_PORT=${IRIS_SQL_PORT:-1972}
    depends_on:
      iris:
        condition: service_healthy

volumes:
  iris-data:
